spring.application.name=YoInvito

# --- Configuración JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update

# Dialecto correcto según versión de Hibernate:
# Si usas Spring Boot 2.x (Hibernate 5.x):
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Si usas Spring Boot 3.x (Hibernate 6.x):
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Configuración de la base de datos ---
spring.datasource.url=jdbc:mysql://localhost:3306/yoinvito
spring.datasource.username=root
spring.datasource.password=WUTF+MEnCUjL+dE8ucKxu3sMjLIWWT6g
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Logging ---
logging.level.org.springframework.web=trace
logging.level.org.hibernate=trace
logging.level.com=TRACE
logging.file.name=backend.log

# --- Puerto del servidor ---
server.port=8080

